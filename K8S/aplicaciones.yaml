---
# ============================================================
# NAMESPACE 1: produccion
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: produccion

---
# App 1: Nginx (web server)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-prod
  namespace: produccion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-prod
  template:
    metadata:
      labels:
        app: nginx-prod
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-prod-svc
  namespace: produccion
spec:
  type: NodePort
  selector:
    app: nginx-prod
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30001

---
# App 2: Redis (cache)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-prod
  namespace: produccion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-prod
  template:
    metadata:
      labels:
        app: redis-prod
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: redis-prod-svc
  namespace: produccion
spec:
  type: NodePort
  selector:
    app: redis-prod
  ports:
  - port: 6379
    targetPort: 6379
    nodePort: 30002

---
# ============================================================
# NAMESPACE 2: staging
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: staging

---
# App 1: Apache (web server)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-staging
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache-staging
  template:
    metadata:
      labels:
        app: apache-staging
    spec:
      containers:
      - name: apache
        image: httpd:alpine
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: apache-staging-svc
  namespace: staging
spec:
  type: NodePort
  selector:
    app: apache-staging
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30003

---
# App 2: PostgreSQL (database)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-staging
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-staging
  template:
    metadata:
      labels:
        app: postgres-staging
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_PASSWORD
          value: "admin123"
        - name: POSTGRES_USER
          value: "admin"
        ports:
        - containerPort: 5432

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-staging-svc
  namespace: staging
spec:
  type: NodePort
  selector:
    app: postgres-staging
  ports:
  - port: 5432
    targetPort: 5432
    nodePort: 30004

---
# ============================================================
# NAMESPACE 3: development
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: development

---
# App 1: Prometheus (monitoring)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-dev
  namespace: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-dev
  template:
    metadata:
      labels:
        app: prometheus-dev
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-dev-svc
  namespace: development
spec:
  type: NodePort
  selector:
    app: prometheus-dev
  ports:
  - port: 9090
    targetPort: 9090
    nodePort: 30005

---
# App 2: Grafana (dashboards)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-dev
  namespace: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-dev
  template:
    metadata:
      labels:
        app: grafana-dev
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        ports:
        - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: grafana-dev-svc
  namespace: development
spec:
  type: NodePort
  selector:
    app: grafana-dev
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30006

---
# ============================================================
# NAMESPACE 4: testing
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: testing

---
# App 1: MySQL (database)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-testing
  namespace: testing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-testing
  template:
    metadata:
      labels:
        app: mysql-testing
    spec:
      containers:
      - name: mysql
        image: mysql:8-alpine
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "root123"
        - name: MYSQL_DATABASE
          value: "testdb"
        ports:
        - containerPort: 3306

---
apiVersion: v1
kind: Service
metadata:
  name: mysql-testing-svc
  namespace: testing
spec:
  type: NodePort
  selector:
    app: mysql-testing
  ports:
  - port: 3306
    targetPort: 3306
    nodePort: 30007

---
# App 2: Adminer (DB UI)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer-testing
  namespace: testing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminer-testing
  template:
    metadata:
      labels:
        app: adminer-testing
    spec:
      containers:
      - name: adminer
        image: adminer:latest
        ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: adminer-testing-svc
  namespace: testing
spec:
  type: NodePort
  selector:
    app: adminer-testing
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30008

---
# ============================================================
# NAMESPACE 5: monitoring
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring

---
# App 1: Elasticsearch (search/logs)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch-monitoring
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch-monitoring
  template:
    metadata:
      labels:
        app: elasticsearch-monitoring
    spec:
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
        env:
        - name: discovery.type
          value: "single-node"
        - name: xpack.security.enabled
          value: "false"
        - name: ES_JAVA_OPTS
          value: "-Xms256m -Xmx256m"
        ports:
        - containerPort: 9200

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-monitoring-svc
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: elasticsearch-monitoring
  ports:
  - port: 9200
    targetPort: 9200
    nodePort: 30009

---
# App 2: Kibana (visualization)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana-monitoring
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana-monitoring
  template:
    metadata:
      labels:
        app: kibana-monitoring
    spec:
      containers:
      - name: kibana
        image: docker.elastic.co/kibana/kibana:8.11.0
        env:
        - name: ELASTICSEARCH_HOSTS
          value: "http://elasticsearch-monitoring-svc:9200"
        ports:
        - containerPort: 5601

---
apiVersion: v1
kind: Service
metadata:
  name: kibana-monitoring-svc
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: kibana-monitoring
  ports:
  - port: 5601
    targetPort: 5601
    nodePort: 30010